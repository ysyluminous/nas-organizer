# 归属域规则（通用模板）
# 这里只放语义明确的通用目录。你自己 NAS 特有的目录名请追加到对应列表，
# 不会覆盖代码内置规则；改完重新运行 classify 即可，无需动代码。

keywords:
  工作:
    - 合同
    - 报表
    - 项目
    - 方案
    - 报告
    - 会议
    - 客户
    - 财务
    - 审计
    - 招标
    - 发票
    - 工资
    - 考勤
    - 周报
    - 总结
    - 规划
    - 架构
    - 接口
    - api
    - deploy
  生活:
    - 照片
    - 家庭
    - 孩子
    - 旅游
    - 菜谱
    - 做饭
    - 健康
    - 体检
    - 保险
    - 购物
    - 电影
    - 电视剧
  个人:
    - 证件
    - 身份证
    - 护照
    - 学历
    - 证书
    - 简历
    - 银行卡
    - 密码
    - 账号
    - 笔记
    - 日记
  资源:
    - 课程
    - 教程
    - 电子书
    - 古籍
    - 合集
    - 素材
    - 下载
    - 收藏
    - 资源
    - 白皮书

# 弱信号：路径中出现即倾向该归属域，优先级低于关键词
paths:
  工作:
    - /工作/
    - /项目/
    - /work/
    - /project/
  生活:
    - /生活/
    - /photos/
    - /相册/
    - /照片/
    - /做饭/
    - /life/
  个人:
    - /个人/
    - /private/
    - /证件/
  资源:
    - /电子书/
    - /国学/
    - /备份/
    - /课程/
    - /ebooks/
    - /books/

# 强信号：路径前缀直接确定归属域和类型（最高优先级）
# 注意：像 /待整理/ 这种混杂目录不要放这里，否则会盖掉关键词判定；
#       让文件名关键词决定它到底归到哪一类。
path_rules:
  - prefix: /电影/
    domain: 生活
    ftype: 视频
  - prefix: /电视剧/
    domain: 生活
    ftype: 视频
  - prefix: /影视/
    domain: 生活
    ftype: 视频
  - prefix: /音乐/
    domain: 生活
    ftype: 音乐
  - prefix: /电子书/
    domain: 资源
    ftype: 图书
