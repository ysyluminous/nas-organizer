# 路径规则：prefix → 直接确定归属域和类型（最高优先级）
path_rules:
  - prefix: /分享内容/电影/
    domain: 生活
    ftype: 视频
  - prefix: /分享内容/电视剧/
    domain: 生活
    ftype: 视频
  - prefix: /分享内容/音乐/
    domain: 生活
    ftype: 音乐
  - prefix: /电子书/
    domain: 资源
    ftype: 图书
  - prefix: /国学/
    domain: 资源
    ftype: 图书
  - prefix: /待整理/
    domain: 资源
