# 文件类型规则：扩展名 → 类型（15 类 / 323 条唯一扩展名）
# 用法：classification.type_rules 指向本文件；自由增删，无需改代码。
# 规则：扩展名小写不带点、同一扩展名只出现一次；命中即返回；
#       未命中的扩展名归入「其他」并在 stats.unknown_ext 计数上报。
# 提示：pdf/txt 默认归「文档」，如需按「图书」处理，在 domain_rules.yaml 用路径规则覆盖。
