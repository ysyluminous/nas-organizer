# NAS Organizer 配置示例
# 复制为 config.yaml 后按实际情况修改

database:
  path: data/nas_organizer.db

# 只读扫描挂载点（容器内路径）
volumes:
  - name: volume1
    path: /nas/8T1
    role: cold
  - name: volume2
    path: /nas/16t1
    role: cold
  - name: volume3
    path: /nas/8t2
    role: cold
  - name: volume4
    path: /nas/1T-ssd
    role: hot
  - name: volume5
    path: /nas/16t2
    role: warm

# 写入目标（仅执行器使用）
write_targets:
  - name: volume5
    path: /write/16t2
    writable: true
  - name: volume4
    path: /write/ssd
    writable: true

classification:
  type_rules: config/type_rules.yaml
  domain_rules: config/domain_rules.yaml
  temperature_rules: config/temperature_rules.yaml
  model:
    enabled: false
    threshold: 0.8
    provider: fasttext
    model_path: data/models/domain.ftz

# D4 人工反馈学习：从 Web/CLI 复核纠正中本地学习，越用越准
# 规则优先，只在低置信度（原本仅凭扩展名归「资源」）时兜底
feedback:
  enabled: true
  max_keywords: 12         # 每条纠正抽取的关键词上限

# D4 可选 AI 兜底：默认关闭，关闭时零依赖、行为与之前完全一致
# 启用后只处理置信度低于 threshold 的疑难件；断网/无 Ollama 时自动降级为人工复核
ai:
  enabled: false
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen2.5:3b
  timeout: 15
  threshold: 0.8
  domains: [个人, 工作, 生活, 资源]

# D4 媒体元数据感知：可选依赖（Pillow / mutagen）缺失时优雅降级
media:
  exif_enabled: true       # 照片按 exif 拍摄日期归档，无 exif 回落 mtime
  id3_enabled: true        # 音乐按 ID3 标签整理，缺标签回退文件名

# D4 感知哈希相似图片：纯 Python DCT，无重依赖；只读发现，不移动文件
perceptual:
  enabled: true
  threshold: 10            # 汉明距离 ≤ 此值视为相似
  hash_size: 8

dedupe:
  head_size: 65536
  tail_size: 65536
  workers: 2

scanner:
  workers: 4
  exclude_dirs:
    - "#recycle"
    - "@eaDir"
    - ".git"
    - "node_modules"

planner:
  conflict_policy: rename   # rename / skip / replace

executor:
  recycle_root: data/recycle
  on_conflict: rename

backup:
  hot:
    enabled: false
    source: /write/16t2
    target: /backup/hot
    schedule: "0 2 * * *"
    max_age_days: 90
    exclude:
      - "*.tmp"
      - "#recycle/*"
  cold:
    enabled: false
    verify_hash: true
    schedule: "0 3 * * 0"

# 认证安全设置（密码本身不写在这里，见 docs/安全与认证.md）
auth:
  token_ttl_seconds: 28800   # 登录有效期 8 小时
  max_failed_attempts: 5     # 连续失败 5 次后临时锁定

# 应用级路径白名单：容器挂载隔离之上的第二层防护
# 留空时自动从 volumes / write_targets / data 目录推导，兼容旧配置
security:
  allowed_paths: []
  # - /nas/8T1
  # - /write/16t2
  strict: true                        # true=越界拒绝；false=仅审计不拦截（仅调试用）
  audit_log: data/security_audit.jsonl

web:
  # 建议绑定 127.0.0.1 并通过反代 + HTTPS 访问；需要局域网直连才用 0.0.0.0
  host: 0.0.0.0
  port: 8765
