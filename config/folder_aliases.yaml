# 文件夹别名 → 标准归类（跨品牌通用，135+ 个别名）
# 命中方式：路径的「目录段」精确匹配（不扫描文件名，避免误伤「电影项目资料」这类目录）。
# 匹配时忽略大小写、空格、下划线、连字符；例如 "TV Shows" / "tv_shows" 均命中。
# 命中后直接确定归属域与类型，置信度高于关键词、低于用户自定义 path_rules。
# 提示：canonical 只是展示用的标准名，不是搬迁目标——搬迁目标仍由 planner 生成。
groups:
  - canonical: 影视/电影
    domain: 生活
    ftype: 视频
    names: [电影, 影片, 大片, 高清电影, 蓝光电影, 4K电影, 电影收藏, 影音, 视听,
             movies, movie, films, film, cinema, bluray, blu-ray, 4k movies]

  - canonical: 影视/剧集
    domain: 生活
    ftype: 视频
    names: [电视剧, 剧集, 连续剧, 美剧, 日剧, 韩剧, 国产剧, 综艺, 纪录片,
             tv shows, tvshows, tv-series, series, drama, episodes, sitcom]

  - canonical: 音乐
    domain: 生活
    ftype: 音乐
    names: [音乐, 歌曲, 无损音乐, 专辑, 唱片, 金曲, 我喜欢的音乐, 音乐库, 车载音乐,
             music, songs, song, albums, album, audio, flac, mp3]

